# MediaMTX configuration
# Docs: https://github.com/bluenviron/mediamtx

logLevel: info
# 720p/30fps 的 WebRTC I 帧会产生短时 RTP 突发；256 容易在网卡调度抖动时
# 误判为持续拥塞。1024 可吸收突发，播放端仍由 WebRTC 拥塞控制保持低延迟。
writeQueueSize: 1024

# RTSP server (ingest)
rtsp: yes
rtspAddress: :8554
# MediaMTX v1.9.3 默认还会监听 RTSP UDP/RTP 端口；本项目 FFmpeg 推流命令使用 RTSP over TCP。

# WHEP server
webrtc: yes
webrtcAddress: :8889
# 固定 WebRTC 媒体 UDP 端口，公网/Tailscale 防火墙只需额外放行这一项。
webrtcLocalUDPAddress: :8189
webrtcEncryption: false


# WHEP paths (explicit for clarity)
# 只公布用户访问侧的接口；前端再按打开网页所使用的 IPv4 地址保留对应候选。
# enP8p1s0 同时承载当前 192.168.123.x 客户端访问，必须公布对应 ICE 候选。
webrtcIPsFromInterfaces: true
webrtcIPsFromInterfacesList:
  - enP8p1s0        # 192.168.123.222 相机/客户端访问网
  - enx00e04c0e6160  # 192.168.144.104 图传/控制网
  - wlP1p1s0        # 192.168.111.60 Wi-Fi/其他局域网
  - tun0            # 10.144.0.4 VPN 隧道
# 例如公网访问使用固定域名时可改为：
# webrtcAdditionalHosts: [botdog.example.com]
webrtcAdditionalHosts: []

paths:
  cam:
    source: publisher
  cam_remote:
    # 主摄像头远程低延迟转码流；由 run-pipeline.sh 从 cam 派生，给远端 Tailscale/WAN 观看使用。
    source: publisher
  cam2:
    # USB 摄像头（后视），由 run-pipeline.sh 中的 FFmpeg 看门狗负责推流
    source: publisher
  cam3:
    # USB 摄像头（左视），由 run-pipeline.sh 中的 FFmpeg 看门狗负责推流
    source: publisher
  cam4:
    # USB 摄像头（右视），由 run-pipeline.sh 中的 FFmpeg 看门狗负责推流
    source: publisher
