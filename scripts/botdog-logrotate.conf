# BotDog 外部进程日志。Python 的 backend/debug/access/ai_ffmpeg 由 Loguru 自行轮转。
@BOTDOG_PROJECT_DIR@/logs/ffmpeg.log
@BOTDOG_PROJECT_DIR@/logs/ffmpeg_cam*.log
@BOTDOG_PROJECT_DIR@/logs/mediamtx.log
@BOTDOG_PROJECT_DIR@/logs/pipeline*.log
@BOTDOG_PROJECT_DIR@/logs/backend_*.log
@BOTDOG_PROJECT_DIR@/logs/botdog.log
@BOTDOG_PROJECT_DIR@/logs/dynamic_avoidance_runtime.log
@BOTDOG_PROJECT_DIR@/logs/radar_health.log
@BOTDOG_PROJECT_DIR@/logs/restart_navigation_localization.log
@BOTDOG_PROJECT_DIR@/logs/start_mapping_debug.log
@BOTDOG_PROJECT_DIR@/logs/scripts/*.log
@BOTDOG_PROJECT_DIR@/logs/ros/*.log
@BOTDOG_PROJECT_DIR@/logs/ros/*/*.log
@BOTDOG_PROJECT_DIR@/logs/ros/*/*/*.log {
    daily
    maxsize 20M
    rotate 7
    maxage 14
    missingok
    notifempty
    compress
    copytruncate
    su @BOTDOG_USER@ @BOTDOG_GROUP@
}
