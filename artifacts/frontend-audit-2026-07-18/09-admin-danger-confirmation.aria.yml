  - text: "机器人连接 宇树 B2 网卡名 UNITREE_NETWORK_IFACE eno1 ARM64 主机上连接机器狗的物理网卡，用 `ip addr` 查看 宇树 B2 默认 IP — 192.168.123.161 B2 机器人的固定出厂 IP，不可更改 控制适配器类型 CONTROL_ADAPTER_TYPE unitree_b2 unitree_b2=真实硬件，simulation=仅打印日志 视频 / 图传 AI 推理 RTSP 地址 AI_RTSP_URL rtsp://127.0.0.1:8554/cam AI Worker 从此地址拉取视频帧进行推理 MediaMTX RTSP 端口 — 127.0.0.1:8554 摄像头推流到此地址（如 ffmpeg/OBS 的推流目标） MediaMTX WHEP 端口 — 127.0.0.1:8889 前端 WebRTC 播放地址的主机和端口 HM30 天空端 IP — 192.168.0.2 HM30 图传天空端的默认管理地址（连接后可访问 Web 配置页） HM30 地面端 IP — 192.168.0.3 HM30 图传地面端的默认管理地址 后端服务 后端监听地址 BACKEND_HOST / BACKEND_PORT 0.0.0.0:8000 前端通过此地址访问 API 和 WebSocket MAVLink 端点 MAVLINK_ENDPOINT udp:127.0.0.1:14550 MAVLink 数据来源（udp=模拟/真实飞控） MAVLink 数据源 MAVLINK_SOURCE simulation mavlink=真实硬件，simulation=内置模拟器"
