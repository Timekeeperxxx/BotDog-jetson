  - paragraph: 仅管理员可执行；所有操作都需要二次确认并写入审计日志。
  - text: 重启后端 重新拉起 FastAPI、WebSocket 和全部后台工作线程
  - button "执行"
  - text: 重启视频流水线 重新拉起 FFmpeg、MediaMTX 和摄像头拉流链路
  - button "执行"
  - text: 重启 AI Worker 重新加载 AI 模型并恢复 RTSP 推理
  - button "执行"
  - text: 重启设备 重启当前主机及其承载的全部 BotDog 服务
  - button "执行"
  - text: 确认重启后端
  - paragraph: 后台接口和实时连接会短暂中断，通常数秒后恢复。 操作提交后无法撤销，确定继续吗？
  - button "取消"
  - button "确认执行"