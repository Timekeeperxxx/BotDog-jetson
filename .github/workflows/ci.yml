name: Regression

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements_basic.txt
            requirements-ci.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg logrotate
      - run: python -m pip install -r requirements-ci.txt
      - run: bash scripts/check-backend.sh --junitxml=backend-tests.xml
        env:
          BOTDOG_TEST_PYTHON: python
      - name: Record tested source and environment
        run: python scripts/record-deployment.py --output artifacts/deployments/ci.json
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: backend-regression
          path: |
            backend-tests.xml
            artifacts/deployments/ci.json
          retention-days: 14

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.4.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 14
